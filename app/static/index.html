<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA-Fix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">HA-Fix</div>
  <span class="grow"></span>
  <button id="lock" class="link" title="Schreibschutz"></button>
  <button id="cog" class="icon" title="Einstellungen" aria-label="Einstellungen">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
  <button id="theme" class="icon" title="Hell/Dunkel" aria-label="Hell/Dunkel">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
  </button>
</header>

<main id="app"></main>

<form id="ask" autocomplete="off">
  <input id="q" placeholder="Etwas anderes stört dich? Schreib es einfach hin …">
  <button id="send">Fragen</button>
</form>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
