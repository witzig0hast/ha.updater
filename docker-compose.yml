services:
  ha-fix:
    image: ghcr.io/witzig0hast/ha.updater:latest
    build: .
    container_name: ha-fix
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
    # Ollama läuft auf dem Host -> der Container erreicht ihn über host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=hermes3:8b
      # Optional:
      # - HAFIX_PASSWORD=geheim     # Passwortschutz der Oberfläche (Benutzername egal)
      # - MAX_SUGGESTIONS=12        # so viele Automationen prüft die KI pro Lauf
